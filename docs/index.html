<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFunML Web</title>
<style>
  :root {
    --bg:#12151a; --panel:#1a1f27; --line:#2b323d; --fg:#dfe5ee; --dim:#8b97a8;
    --accent:#4ea3ff; --bad:#ff5c7a;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:24px; background:var(--bg); color:var(--fg);
    font:14px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 16px; }

  #drop {
    border:1px dashed var(--line); border-radius:10px; padding:26px;
    text-align:center; cursor:pointer; color:var(--dim); margin-bottom:16px;
    transition:border-color .15s, color .15s, background .15s;
  }
  #drop.over { border-color:var(--accent); color:var(--fg); background:#161c26; }
  #drop.has { border-style:solid; color:var(--fg); }
  #drop b { font-weight:600; }
  #drop small { display:block; color:var(--dim); margin-top:4px; }

  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media (max-width:820px) { .cols { grid-template-columns:1fr; } }

  section { background:var(--panel); border:1px solid var(--line); border-radius:10px;
            padding:16px 18px; }
  .group + .group { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .group > h2 { font-size:12px; margin:0 0 10px; color:var(--dim); font-weight:600;
                text-transform:uppercase; letter-spacing:.07em; }

  .row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .row.hidden { display:none; }
  .row > label { flex:1 1 auto; color:var(--fg); font-size:13px; min-width:0; }
  .row > input[type=number], .row > select {
    flex:0 0 108px; background:#0d1015; color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:6px 8px; font:inherit; font-size:13px;
  }
  .row > select.wide { flex:0 0 148px; }
  .row > input[type=checkbox] { flex:0 0 auto; width:16px; height:16px; accent-color:var(--accent); }

  .stack { display:block; margin-bottom:10px; }
  .stack > span { display:block; color:var(--dim); font-size:12px; margin-bottom:4px; }
  .stack > select {
    width:100%; background:#0d1015; color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:7px 9px; font:inherit; font-size:13px;
  }

  button {
    background:var(--accent); color:#04121f; border:0; border-radius:7px;
    padding:10px 20px; font:inherit; font-weight:600; cursor:pointer;
  }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .actions { display:flex; gap:10px; align-items:center; margin:14px 0 0; }

  .warn { margin:10px 0 0; color:var(--dim); font-size:12px; line-height:1.5; }
  .warn a { color:var(--accent); }

  #bar { height:6px; background:#0d1015; border-radius:3px; overflow:hidden; margin:12px 0 0; }
  #bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  #status { min-height:20px; margin-top:6px; color:var(--dim); font-size:12px; }

  /* Always takes its space so the column does not jump when a run finishes. */
  #heat { display:block; width:100%; height:90px; margin-top:8px;
          background:#0d1015; border:1px solid var(--line); border-radius:8px; }

  #dl { display:block; margin-top:12px; }
  #dl a { color:var(--accent); }

  #log { background:#0d1015; border:1px solid var(--line); border-radius:8px; padding:12px;
         height:200px; overflow:auto; margin:12px 0 0;
         font:12px/1.55 ui-monospace, Consolas, monospace; color:var(--dim); white-space:pre-wrap; }
  #log .e { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>OpenFunML Web</h1>

  <div id="drop">
    <b>Drop a video here</b>
    <small>or click to choose one</small>
  </div>
  <input type="file" id="video" accept="video/*" hidden>

  <div class="cols">
    <section id="options"></section>

    <section>
      <label class="stack"><span>Model</span>
        <select id="model">
          <option value="0.3">OpenFunML 0.3</option>
          <option value="0.2">OpenFunML 0.2</option>
        </select>
      </label>
      <label class="stack"><span>Compute</span>
        <select id="provider">
          <option value="auto">Auto</option>
          <option value="webgpu">WebGPU</option>
          <option value="wasm">CPU (WebAssembly)</option>
        </select>
      </label>

      <div class="actions">
        <button id="run">Generate</button>
        <button id="cancel" class="ghost" disabled>Stop</button>
      </div>
      <p class="warn">
        This page is for trying things out and is very slow. For real use, install
        the OpenFunscripter extension from the
        <a href="https://github.com/oddish-m/OpenFunML/releases" target="_blank" rel="noopener">releases</a>
        page.
      </p>

      <div id="bar"><i></i></div>
      <div id="status"></div>

      <canvas id="heat"></canvas>
      <span id="dl"></span>
      <pre id="log"></pre>
    </section>
  </div>
</main>

<script type="module">
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.min.mjs";
import { params, overlapAdd, postprocess } from "./post.js";
import { readModelMetadata, readSpec } from "./onnxmeta.js";

const CORE_BASE = "https://unpkg.com/@ffmpeg/core@0.12.10/dist/umd";
const ORT_BASE = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/";

// SharedArrayBuffer is what needs COOP/COEP, and static hosting cannot set
// those headers. Pinning to one thread keeps the page servable from anywhere.
ort.env.wasm.wasmPaths = ORT_BASE;
ort.env.wasm.numThreads = 1;
ort.env.wasm.proxy = false;

// Not exposed in OFS, so the page uses the same values the plugin passes.
const OVERLAP = 0.5;
const CROP_X = 0.5;
const CROP_Y = 0.5;
const SHOULDER_FRAC = 0.35;
const CHUNK_SECONDS = 60;

const $ = (id) => document.getElementById(id);

// --- options -----------------------------------------------------------------
//
// Same sections, order, defaults, ranges and wording as the OFS extension
// (src/OpenDeepFun/extension/main.lua). Anything the extension does not expose
// is not exposed here either.

const VR_CHOICES = ["auto", "sbs180", "tb180", "mono180",
                    "fisheye180", "fisheye190", "fisheye200", "fisheye220"];
const VR_LABELS = ["Auto", "180 side-by-side", "180 over-under", "180 mono",
                   "Fisheye 180", "Fisheye 190", "Fisheye 200 (MKX200)",
                   "Fisheye 220 (MKX220)"];

const vrOn = (o) => o.vr;
const shouldersOn = (o) => o.shoulder_peaks || o.shoulder_valleys;

const SECTIONS = [
  { title: "VR", items: [
    { id: "vr", label: "VR video", kind: "bool", d: false,
      tip: "Takes one eye and flattens a window out of it. Without this a 180 side-by-side frame is cropped straight through the middle, giving half of each eye with a seam between them" },
    { id: "vr_format", label: "VR format", kind: "enum", d: "auto",
      choices: VR_CHOICES, labels: VR_LABELS, when: vrOn,
      tip: "Auto reads the file name (LR, TB, MKX200, RF52...) and falls back to the frame shape. Change it if the unwarped view looks wrong" },
    { id: "vr_pitch", label: "Look angle", kind: "int", d: -20, min: -90, max: 90, when: vrOn,
      tip: "How far down the view is aimed. VR POV looks downward, so this is negative. Lower it if the action sits below the frame" },
    { id: "vr_fov", label: "Field of view", kind: "int", d: 100, min: 40, max: 160, when: vrOn,
      tip: "How wide a window is taken. Narrower fills the frame with the action but can cut it off when it moves" },
  ]},
  { title: "Device limits", items: [
    { id: "max_speed", label: "Max speed", kind: "int", d: 650, min: 100, max: 2000,
      tip: "Units per second the device can reach. Human scripts run 542 at the 95th percentile and 670 at the 99th" },
  ]},
  { title: "Detection", items: [
    { id: "heatmap_threshold", label: "Heatmap threshold", kind: "num", d: 0.20, min: 0.02, max: 0.60, step: 0.01,
      tip: "Lower finds more peaks. Strongest control over stroke count" },
    { id: "prominence_min", label: "Prominence min", kind: "num", d: 0.08, min: 0.01, max: 0.30, step: 0.01,
      tip: "Absolute floor for peak detection. Raise it to ignore jitter in quiet sections" },
  ]},
  { title: "Stroke shaping", items: [
    { id: "stroke_gain", label: "Stroke gain", kind: "num", d: 1.2, min: 0.5, max: 3.0, step: 0.1,
      tip: "Scales every stroke around its own midpoint. Human scripts have a median stroke of 79. Above 1.3 the median becomes a full 0-100 swing" },
    { id: "stroke_min", label: "Min stroke size", kind: "num", d: 40.0, min: 0.0, max: 100.0, step: 1,
      tip: "Strokes smaller than this are widened, keeping their centre. For reference the 10th percentile of human scripts is 30" },
    { id: "anchor", label: "Anchor to position", kind: "bool", d: true,
      tip: "Keeps a fast stroke at the height the model saw it, instead of drifting to the middle. Turn off to use the raw peak positions" },
    { id: "recenter", label: "Recentre", kind: "bool", d: true,
      tip: "Shifts the whole script when it sits against the top or the bottom for the entire video, so the unused room is split evenly. Amplitude and timing are untouched. Does nothing when the script already uses the full range" },
  ]},
  { title: "Shoulders", items: [
    { id: "shoulder_peaks", label: "Shoulders on peaks", kind: "bool", d: false,
      tip: "Adds a point either side of each slow peak, slightly below it, so the stroke reaches the top faster and lingers there. The peak itself does not move, so amplitude is unchanged" },
    { id: "shoulder_valleys", label: "Shoulders on valleys", kind: "bool", d: false,
      tip: "The same at the bottom of each stroke. Turn only one on to shape one end differently" },
    { id: "shoulder_drop", label: "Shoulder depth", kind: "num", d: 0.15, min: 0.02, max: 0.40, step: 0.01, when: shouldersOn,
      tip: "How far the shoulder sits below the peak, as a share of the stroke. Larger means a flatter, longer dwell and a steeper approach" },
    { id: "shoulder_min_ms", label: "Shoulder min stroke ms", kind: "int", d: 300, min: 100, max: 1000, when: shouldersOn,
      tip: "Shortest stroke that gets shoulders. Faster strokes are left alone - there is no room to linger and the extra points would crowd the 60ms minimum spacing" },
  ]},
  { title: "Vibration", items: [
    { id: "vibrate", label: "Vibrate in pauses", kind: "bool", d: false,
      tip: "Adds a small flutter where stroking pauses briefly - a gap much longer than the surrounding rhythm, where the model still sees activity. Continuous stroking and long stops are both left alone" },
    { id: "vibrate_amp", label: "Vibrate depth", kind: "num", d: 15.0, min: 4.0, max: 60.0, step: 1, when: (o) => o.vibrate,
      tip: "How far the flutter travels, in position units" },
    { id: "vibrate_rhythm", label: "Pause threshold", kind: "num", d: 3.0, min: 1.2, max: 6.0, step: 0.1, when: (o) => o.vibrate,
      tip: "How much longer than the surrounding rhythm a gap must be to count as a pause. Raise it if the flutter appears where stroking never actually stopped" },
    { id: "vibrate_cycles", label: "Vibrate cycles", kind: "int", d: 7, min: 1, max: 15, when: (o) => o.vibrate,
      tip: "How many times it flutters. The burst is centred in the pause however long the pause is" },
  ]},
  { title: "Timing", items: [
    { id: "time_offset", label: "Time offset ms", kind: "int", d: 0, min: -2000, max: 2000, step: 10,
      tip: "Shifts every keypoint in time. Positive moves them later. Use when the script feels consistently early or late against the video" },
  ]},
  { title: "Output range", items: [
    { id: "out_min", label: "Position min", kind: "int", d: 0, min: 0, max: 100,
      tip: "Lowest position value written to the script" },
    { id: "out_max", label: "Position max", kind: "int", d: 100, min: 0, max: 100,
      tip: "Highest position value written to the script" },
  ]},
];

const opts = {};
const rows = [];

function buildOptions() {
  const host = $("options");
  for (const section of SECTIONS) {
    const group = document.createElement("div");
    group.className = "group";
    const heading = document.createElement("h2");
    heading.textContent = section.title;
    group.appendChild(heading);

    for (const item of section.items) {
      opts[item.id] = item.d;

      const row = document.createElement("div");
      row.className = "row";
      row.title = item.tip;

      const label = document.createElement("label");
      label.textContent = item.label;
      label.htmlFor = `o_${item.id}`;

      let field;
      if (item.kind === "bool") {
        field = document.createElement("input");
        field.type = "checkbox";
        field.checked = item.d;
        field.addEventListener("change", () => { opts[item.id] = field.checked; refresh(); });
      } else if (item.kind === "enum") {
        field = document.createElement("select");
        field.className = "wide";
        item.choices.forEach((value, i) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = item.labels[i];
          field.appendChild(option);
        });
        field.value = item.d;
        field.addEventListener("change", () => { opts[item.id] = field.value; });
      } else {
        field = document.createElement("input");
        field.type = "number";
        field.min = item.min;
        field.max = item.max;
        field.step = item.step ?? 1;
        field.value = item.d;
        // An input box does not clamp on its own, and the extension clamps too.
        field.addEventListener("change", () => {
          let v = parseFloat(field.value);
          if (!Number.isFinite(v)) v = item.d;
          if (item.kind === "int") v = Math.round(v);
          v = Math.min(item.max, Math.max(item.min, v));
          field.value = v;
          opts[item.id] = v;
        });
      }
      field.id = `o_${item.id}`;

      // Checkbox first reads better than a checkbox stranded on the right.
      if (item.kind === "bool") row.append(field, label);
      else row.append(label, field);

      group.appendChild(row);
      rows.push({ row, item });
    }
    host.appendChild(group);
  }
  refresh();
}

// Options that only matter while their feature is on are hidden while it is
// off, so the panel shows what is actually in effect.
function refresh() {
  for (const { row, item } of rows) {
    row.classList.toggle("hidden", item.when ? !item.when(opts) : false);
  }
}

// --- log / progress ----------------------------------------------------------

const logEl = $("log");
const barEl = $("bar").firstElementChild;
let cancelled = false;

function say(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
function progress(frac) {
  barEl.style.width = Math.max(0, Math.min(1, frac)) * 100 + "%";
}
const breathe = () => new Promise((r) => setTimeout(r, 0));

// Same wording and the same estimate as the OFS extension: the remaining time
// is elapsed/done - elapsed, and it stays "estimating" until enough of the run
// is behind us for that to mean anything.
const STAGE_LABEL = {
  load: "loading model",
  infer: "analysing video",
  post: "building keypoints",
  done: "done",
};

// OFS appends " left" unconditionally, which reads as "estimating left" for the
// first few seconds. Same numbers, one less wart.
function fmtTime(sec) {
  if (!(sec > 0)) return "estimating";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m > 0 ? `${m}m ${s}s` : `${s}s`} left`;
}

let runStarted = 0;

function status(stage, frac) {
  const label = STAGE_LABEL[stage] || stage;
  if (stage === "infer") {
    const elapsed = (Date.now() - runStarted) / 1000;
    const eta = frac > 0.02 ? elapsed / frac - elapsed : 0;
    $("status").textContent = `${label}  |  ${fmtTime(eta)}`;
  } else {
    $("status").textContent = label;
  }
}

// --- file drop ---------------------------------------------------------------

let videoFile = null;

function setVideo(file) {
  if (!file) return;
  videoFile = file;
  const drop = $("drop");
  drop.classList.add("has");
  drop.innerHTML = "";
  const name = document.createElement("b");
  name.textContent = file.name;
  const size = document.createElement("small");
  size.textContent = `${(file.size / 1073741824).toFixed(2)} GB — click to choose another`;
  drop.append(name, size);
}

{
  const drop = $("drop");
  const picker = $("video");
  drop.addEventListener("click", () => picker.click());
  picker.addEventListener("change", () => setVideo(picker.files[0]));
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    setVideo(e.dataTransfer.files[0]);
  });
}

// --- video.py port -----------------------------------------------------------

const VR_FORMATS = {
  sbs180: ["hequirect", 180, "sbs"],
  tb180: ["hequirect", 180, "tb"],
  mono180: ["hequirect", 180, "2d"],
  fisheye180: ["fisheye", 180, "sbs"],
  fisheye190: ["fisheye", 190, "sbs"],
  fisheye200: ["fisheye", 200, "sbs"],
  fisheye220: ["fisheye", 220, "sbs"],
};

// Most specific first. scripts/check_vr_tags.py fails the build if the copies drift.
const VR_TAGS = [
  ["mkx220", "fisheye220"], ["vrca220", "fisheye220"], ["220x180", "fisheye220"],
  ["mkx200", "fisheye200"], ["vrca200", "fisheye200"], ["200x180", "fisheye200"],
  ["rf52", "fisheye190"], ["fisheye190", "fisheye190"], ["190x180", "fisheye190"],
  ["fisheye", "fisheye180"],
  ["_tb", "tb180"], ["_ou", "tb180"], ["3dv", "tb180"],
  ["overunder", "tb180"], ["over_under", "tb180"],
  ["_mono", "mono180"], ["mono_180", "mono180"], ["180_mono", "mono180"],
  ["_lr", "sbs180"], ["_sbs", "sbs180"], ["3dh", "sbs180"],
  ["sidebyside", "sbs180"], ["side_by_side", "sbs180"],
];

function detectVrFormat(name, width, height) {
  const lower = name.toLowerCase();
  for (const [tag, fmt] of VR_TAGS) if (lower.includes(tag)) return fmt;
  if (width > 0 && height > 0) {
    const ratio = width / height;
    if (ratio >= 1.8) return "sbs180";
    if (ratio <= 0.6) return "tb180";
    if (ratio >= 0.9 && ratio <= 1.1) return "mono180";
  }
  return "sbs180";
}

function vrFilter(fmt, pitch, outFov, size) {
  const [projection, inFov, stereo] = VR_FORMATS[fmt];
  return `v360=input=${projection}:in_stereo=${stereo}:output=flat:out_stereo=2d` +
    `:ih_fov=${inFov}:iv_fov=${inFov}:h_fov=${outFov}:v_fov=${outFov}` +
    `:pitch=${pitch}:w=${size}:h=${size}`;
}

function cropRect(width, height, cx, cy, maxRatio) {
  const ratio = width / height;
  let cropW, cropH;
  if (maxRatio > 1.0 && ratio > maxRatio) {
    cropW = Math.round(height * maxRatio); cropH = height;
  } else if (maxRatio > 1.0 && ratio < 1.0 / maxRatio) {
    cropW = width; cropH = Math.round(width * maxRatio);
  } else {
    cropW = width; cropH = height;
  }
  const cropX = Math.max(0, Math.min(Math.round((width - cropW) * cx), width - cropW));
  const cropY = Math.max(0, Math.min(Math.round((height - cropH) * cy), height - cropH));
  return [cropW, cropH, cropX, cropY];
}

function contentSize(cropW, cropH, size) {
  let w, h;
  if (cropW >= cropH) { w = size; h = Math.max(1, Math.round((size * cropH) / cropW)); }
  else { h = size; w = Math.max(1, Math.round((size * cropW) / cropH)); }
  w -= w % 2; h -= h % 2;
  return [Math.max(2, w), Math.max(2, h)];
}

function scaleSize(cropW, cropH, contentW, contentH, size) {
  if (contentW >= contentH) return [size, Math.max(2, Math.round((size * cropH) / cropW) & ~1)];
  return [Math.max(2, Math.round((size * cropW) / cropH) & ~1), size];
}

// The fps grid is pinned to the container start time. Without that, every
// seek restarts the grid at whatever frame the chunk begins on and the
// boundaries drift by up to one frame.
//
// Unlike video.py's filter_chain there is no `pad` here - the letterbox is
// filled in JS. `pad=...:black` gives Y=16 on the wasm core and 0 on the build
// the training preprocess and the desktop plugin use. Content pixels are
// identical either way, and the model learned 0.
function filterChain(width, height, size, fps, start, cx, cy, maxRatio, vr) {
  const head = `fps=fps=${fps}:start_time=${start.toFixed(6)}`;
  if (vr) {
    // v360 already emits a square, so there is nothing to letterbox.
    return { chain: [head, vr, "format=gray", "showinfo"].join(","), w: size, h: size };
  }

  const [cropW, cropH, cropX, cropY] = cropRect(width, height, cx, cy, maxRatio);
  const [cw, ch] = contentSize(cropW, cropH, size);
  const [sw, sh] = scaleSize(cropW, cropH, cw, ch, size);
  return {
    chain: [
      head,
      `crop=${cropW}:${cropH}:${cropX}:${cropY}`,
      `scale=${sw}:${sh}`,
      "format=gray",
      "showinfo",
    ].join(","),
    w: sw,
    h: sh,
  };
}

// --- ffmpeg ------------------------------------------------------------------

let ffLog = [];

class FFmpegWorker {
  constructor() {
    this.worker = null;
    this.seq = 0;
    this.pending = new Map();
  }

  async load() {
    this.worker = new Worker("./ffmpeg-worker.js");
    this.worker.onmessage = ({ data }) => {
      if (data.type === "log") { ffLog.push(data.data.message); return; }
      if (data.type === "progress") return;
      const slot = this.pending.get(data.id);
      if (!slot) return;
      this.pending.delete(data.id);
      if (data.type === "error") slot.reject(new Error(data.data));
      else slot.resolve(data.data);
    };
    this.worker.onerror = (event) => {
      for (const slot of this.pending.values()) slot.reject(new Error(event.message || "worker failed"));
      this.pending.clear();
    };
    await this.call("load", {
      coreURL: `${CORE_BASE}/ffmpeg-core.js`,
      wasmURL: `${CORE_BASE}/ffmpeg-core.wasm`,
    });
  }

  call(type, data, transfer) {
    const id = ++this.seq;
    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      this.worker.postMessage({ id, type, data }, transfer || []);
    });
  }
}

let ffmpeg = null;

async function getFFmpeg() {
  if (ffmpeg) return ffmpeg;
  say("Downloading the ffmpeg core (about 30 MB, first run only)…");
  const ff = new FFmpegWorker();
  await ff.load();
  ffmpeg = ff;
  say("ffmpeg ready");
  return ffmpeg;
}

async function exec(args) {
  ffLog = [];
  await ffmpeg.call("exec", { args });
  return ffLog;
}

function parseProbe(lines) {
  let duration = 0, start = 0, width = 0, height = 0;
  for (const line of lines) {
    const d = line.match(/Duration:\s*(\d+):(\d+):([\d.]+)/);
    if (d) {
      duration = (+d[1]) * 3600 + (+d[2]) * 60 + parseFloat(d[3]);
      const s = line.match(/start:\s*(-?[\d.]+)/);
      if (s) start = Math.max(0, parseFloat(s[1]));
    }
    if (/Stream #.*Video:/.test(line)) {
      const wh = line.match(/,\s*(\d{2,5})x(\d{2,5})/);
      if (wh && !width) { width = +wh[1]; height = +wh[2]; }
    }
  }
  return { duration, start, width, height };
}

// --- heatmap -----------------------------------------------------------------

const HEAT_STOPS = [
  [0.00, [30, 150, 255]], [0.25, [0, 200, 210]], [0.45, [30, 210, 80]],
  [0.65, [240, 220, 30]], [0.82, [255, 120, 20]], [0.94, [255, 40, 50]],
  [1.00, [255, 40, 180]],
];

function heatColor(t) {
  for (let i = 1; i < HEAT_STOPS.length; i++) {
    if (t <= HEAT_STOPS[i][0]) {
      const [t0, c0] = HEAT_STOPS[i - 1];
      const [t1, c1] = HEAT_STOPS[i];
      const f = (t - t0) / (t1 - t0);
      const mix = (a, b) => Math.round(a + (b - a) * f);
      return `rgb(${mix(c0[0], c1[0])},${mix(c0[1], c1[1])},${mix(c0[2], c1[2])})`;
    }
  }
  return "rgb(255,40,180)";
}

function pct(values, p) {
  const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
  if (!sorted.length) return 0;
  return sorted[Math.floor((sorted.length - 1) * p)];
}

let heatActions = [];

function drawHeatmap() {
  const canvas = $("heat");
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;

  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  if (heatActions.length < 2) return;

  const duration = heatActions[heatActions.length - 1].at || 1;
  const speeds = [];
  for (let i = 1; i < heatActions.length; i++) {
    const dt = heatActions[i].at - heatActions[i - 1].at;
    if (dt > 0) speeds.push(Math.abs(heatActions[i].pos - heatActions[i - 1].pos) / (dt / 1000));
  }
  const maxSpeed = pct(speeds, 0.95) || 1;

  ctx.lineWidth = 1;
  for (let i = 1; i < heatActions.length; i++) {
    const a = heatActions[i - 1];
    const b = heatActions[i];
    const dt = b.at - a.at;
    if (dt <= 0) continue;
    const speed = Math.abs(b.pos - a.pos) / (dt / 1000);
    ctx.strokeStyle = heatColor(Math.min(speed / maxSpeed, 1));
    ctx.beginPath();
    ctx.moveTo((a.at / duration) * width, height - (a.pos / 100) * height);
    ctx.lineTo((b.at / duration) * width, height - (b.pos / 100) * height);
    ctx.stroke();
  }
}

window.addEventListener("resize", drawHeatmap);

// --- run ---------------------------------------------------------------------

function collectParams() {
  return params({
    out_min: opts.out_min,
    out_max: opts.out_max,
    stroke_gain: opts.stroke_gain,
    stroke_min: opts.stroke_min,
    max_speed: opts.max_speed,
    anchor: opts.anchor,
    recenter: opts.recenter,
    prominence_min: opts.prominence_min,
    heatmap_threshold: opts.heatmap_threshold,
    shoulder_peaks: opts.shoulder_peaks,
    shoulder_valleys: opts.shoulder_valleys,
    shoulder_frac: SHOULDER_FRAC,
    shoulder_drop: opts.shoulder_drop,
    shoulder_min_ms: opts.shoulder_min_ms,
    vibrate: opts.vibrate,
    vibrate_amp: opts.vibrate_amp,
    vibrate_rhythm_factor: opts.vibrate_rhythm,
    vibrate_max_cycles: opts.vibrate_cycles,
  });
}

async function loadModel() {
  const url = `./models/OpenFunML-${$("model").value}.onnx`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Could not load the model: ${url} (${res.status})`);
  const bytes = new Uint8Array(await res.arrayBuffer());

  const s = readSpec(readModelMetadata(bytes));
  const want = $("provider").value;
  const providers = want === "auto"
    ? (navigator.gpu ? ["webgpu", "wasm"] : ["wasm"])
    : [want];

  let session;
  try {
    session = await ort.InferenceSession.create(bytes, { executionProviders: providers });
  } catch (err) {
    if (providers[0] === "wasm") throw err;
    say(`${providers[0]} unavailable, falling back to CPU: ${err.message}`, "e");
    session = await ort.InferenceSession.create(bytes, { executionProviders: ["wasm"] });
  }
  say(`Model ${$("model").value} loaded (${(bytes.length / 1048576).toFixed(1)} MB)`);
  return { session, s };
}

async function process() {
  if (!videoFile) throw new Error("Choose a video first");
  const file = videoFile;

  status("load");
  const { session, s } = await loadModel();
  const p = collectParams();

  await getFFmpeg();

  const mount = "/mnt";
  await ffmpeg.call("mkdir", { path: mount });
  try { await ffmpeg.call("unmount", { mountPoint: mount }); } catch (_) {}
  // WORKERFS reads the File in place. writeFile would copy the whole video
  // into a 32-bit wasm heap and die on anything large.
  await ffmpeg.call("mount", {
    fsType: "WORKERFS", options: { files: [file] }, mountPoint: mount,
  });
  const input = `${mount}/${file.name}`;

  await exec(["-hide_banner", "-i", input]);
  const info = parseProbe(ffLog);
  if (!info.width || !info.duration) throw new Error("Could not read the video");
  say(`${info.width}x${info.height}, ${info.duration.toFixed(1)}s, start ${(info.start * 1000).toFixed(0)}ms`);

  let vr = null;
  if (opts.vr) {
    const chosen = opts.vr_format === "auto"
      ? detectVrFormat(file.name, info.width, info.height)
      : opts.vr_format;
    vr = vrFilter(chosen, opts.vr_pitch, opts.vr_fov, s.size);
    say(`VR ${chosen}, pitch ${opts.vr_pitch}, fov ${opts.vr_fov}`);
  }

  const { chain, w: rawW, h: rawH } = filterChain(
    info.width, info.height, s.size, s.fps, info.start, CROP_X, CROP_Y, s.cropRatio, vr
  );

  const rawFrameBytes = rawW * rawH;
  const frameBytes = s.size * s.size;
  const padX = (s.size - rawW) >> 1;
  const padY = (s.size - rawH) >> 1;

  const padFrame = (src) => {
    if (rawW === s.size && rawH === s.size) return src;
    const dst = new Uint8Array(frameBytes);
    for (let y = 0; y < rawH; y++) {
      dst.set(src.subarray(y * rawW, (y + 1) * rawW), (y + padY) * s.size + padX);
    }
    return dst;
  };

  const hop = Math.max(1, Math.round(s.clipLen * (1.0 - OVERLAP)));
  const chunkFrames = Math.max(s.clipLen, Math.round(CHUNK_SECONDS * s.fps));
  const expected = Math.max(Math.floor(info.duration * s.fps), s.clipLen);

  const inputName = session.inputNames[0];
  const chunks = {};
  for (const name of s.outputs) chunks[name] = [];
  const starts = [];

  let buf = [];
  let bufStart = 0;
  let total = 0;
  let lastEnd = 0;
  const tail = [];

  // The estimate covers decoding and inference, which is all but a rounding
  // error of the run. It starts here so model download does not skew it.
  runStarted = Date.now();
  status("infer", 0);

  async function runWindow(start, frames) {
    const data = new Float32Array(s.clipLen * frameBytes);
    let o = 0;
    for (const frame of frames) {
      for (let i = 0; i < frameBytes; i++) {
        data[o++] = (frame[i] / 255.0 - s.mean) / s.std;
      }
    }
    const tensor = new ort.Tensor("float32", data, [1, s.clipLen, 1, s.size, s.size]);
    const out = await session.run({ [inputName]: tensor });
    for (const name of s.outputs) chunks[name].push(Float64Array.from(out[name].data));
    starts.push(start);
    lastEnd = start + s.clipLen;
  }

  for (let ci = 0; ; ci++) {
    if (cancelled) throw new Error("Stopped");

    const seek = info.start + (ci * chunkFrames) / s.fps;
    if (seek >= info.start + info.duration) break;

    const out = "/chunk.gray";
    await exec([
      "-hide_banner", "-copyts", "-ss", seek.toFixed(6), "-i", input,
      "-an", "-sn", "-dn", "-vf", chain, "-frames:v", String(chunkFrames),
      "-f", "rawvideo", "-pix_fmt", "gray", "-y", out,
    ]);

    // showinfo gives the absolute pts of the first frame of this chunk. The
    // grid is pinned to the container start, so the global frame number falls
    // out as an integer. Nothing is guessed.
    let firstPts = null;
    for (const line of ffLog) {
      const m = line.match(/pts_time:(-?[\d.]+)/);
      if (m) { firstPts = parseFloat(m[1]); break; }
    }

    let raw;
    try {
      raw = await ffmpeg.call("readFile", { path: out });
    } catch (_) {
      break;
    }
    await ffmpeg.call("unlink", { path: out });

    const count = Math.floor(raw.length / rawFrameBytes);
    if (!count) break;

    const globalStart = firstPts === null
      ? ci * chunkFrames
      : Math.round((firstPts - info.start) * s.fps);

    if (!buf.length) bufStart = globalStart;
    const skip = Math.max(0, bufStart + buf.length - globalStart);

    for (let k = skip; k < count; k++) {
      const frame = padFrame(raw.subarray(k * rawFrameBytes, (k + 1) * rawFrameBytes));
      buf.push(frame);
      tail.push(frame);
      if (tail.length > s.clipLen) tail.shift();
      total = Math.max(total, globalStart + k + 1);

      while (buf.length >= s.clipLen) {
        await runWindow(bufStart, buf.slice(0, s.clipLen));
        buf = buf.slice(hop);
        bufStart += hop;
        const frac = Math.min(1, (bufStart + s.clipLen) / expected);
        progress(frac);
        status("infer", frac);
        await breathe();
      }
    }

    if (count < chunkFrames) break;
  }

  if (!starts.length) throw new Error(`The video is shorter than ${s.clipLen} frames`);
  if (total >= s.clipLen && lastEnd < total && tail.length === s.clipLen) {
    await runWindow(total - s.clipLen, tail);
  }
  total = Math.max(total, starts[starts.length - 1] + s.clipLen);

  say("Building keypoints…");
  status("post");
  progress(0.99);
  await breathe();

  const signals = s.outputs.map((name) => overlapAdd(chunks[name], starts, total));
  const result = postprocess(
    signals[0], signals[1], signals[2], signals[3], s.fps, s.velocityScale, p
  );

  // The container start time is not added here. The fps grid is already pinned
  // to it, so frame i is player time i/fps - the same rule as the training
  // preprocess. The desktop plugin decodes with PyAV, which hands back the real
  // pts, and so has to add it.
  const actions = [];
  for (let i = 0; i < result.atMs.length; i++) {
    const at = Math.round(result.atMs[i] + opts.time_offset);
    if (at < 0) continue;
    actions.push({ at, pos: Math.max(0, Math.min(100, Math.round(result.pos[i]))) });
  }

  heatActions = actions;
  drawHeatmap();

  const funscript = {
    version: "1.0",
    inverted: false,
    range: 100,
    actions,
    metadata: { creator: "OpenFunML Web" },
  };

  const blob = new Blob([JSON.stringify(funscript)], { type: "application/json" });
  const name = file.name.replace(/\.[^.]+$/, "") + ".funscript";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.textContent = `Download ${name} (${actions.length} points)`;
  $("dl").replaceChildren(a);

  progress(1);
  status("done");
  say(`Done. ${actions.length} keypoints`);

  try { await ffmpeg.call("unmount", { mountPoint: mount }); } catch (_) {}
}

$("run").addEventListener("click", async () => {
  cancelled = false;
  $("run").disabled = true;
  $("cancel").disabled = false;
  $("dl").replaceChildren();
  logEl.replaceChildren();
  heatActions = [];
  drawHeatmap();
  progress(0);
  $("status").textContent = "";
  try {
    await process();
  } catch (err) {
    say(err && err.message ? err.message : String(err), "e");
    $("status").textContent = "";
    console.error(err);
  } finally {
    $("run").disabled = false;
    $("cancel").disabled = true;
  }
});

$("cancel").addEventListener("click", () => {
  cancelled = true;
  say("Stopping after the current chunk…");
});

buildOptions();
</script>
</body>
</html>
